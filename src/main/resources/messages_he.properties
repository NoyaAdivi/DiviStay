faq.4.a=כן. בוחרים "לפי חדר", והמחיר של כל חדר מתחלק בין מי שישן בו. אפשר גם לקבוע סכום אישי לכל אחד.
faq.5.q=זה אתר הזמנות אמיתי?
faq.5.a=עדיין לא. DiviStay הוא פרויקט סטודנטים: המלונות לדוגמה והתשלומים מדומים, כך שלא עובר כסף אמיתי.
