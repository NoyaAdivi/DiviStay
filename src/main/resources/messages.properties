why.eyebrow=Why DiviStay
why.title=Built so nobody gets stuck with the bill
why.1.title=Rooms are locked
why.1.text=The rooms are held for 30 minutes while the group pays, so nobody else can take them.
why.2.title=All or nothing
why.2.text=Payments are only held. Cards are charged when everyone has paid and the hotel confirms.
why.3.title=Private links
why.3.text=Every person gets their own unguessable link. No accounts, no passwords.
why.4.title=Never stuck
why.4.text=If time runs out or the hotel can't confirm, the rooms are released and every hold is cancelled.
faq.eyebrow=Questions
faq.title=Good to know
faq.1.q=Is my card charged right away?
faq.1.a=No. The amount is only held on your card. It is charged once everyone in the group has paid and the hotel confirms the booking.
faq.2.q=What happens if someone doesn't pay in time?
faq.2.a=After 30 minutes the rooms are released and every hold is cancelled automatically, so nobody pays for a booking that didn't happen.
faq.3.q=Do my friends need an account?
faq.3.a=No. Each person gets a personal payment link by email and pays from it directly.
faq.4.q=Can we split by room instead of equally?
faq.4.a=Yes. Choose "By room" and each room's price is shared by the people staying in it, or set a custom amount for each person.
faq.5.q=Is this a real booking site?
faq.5.a=Not yet. DiviStay is a student project: the hotels are examples and payments are simulated, so no real money moves.
