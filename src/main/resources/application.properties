spring.application.name=divistay
# On a hosting service the port comes from the PORT variable; on your computer it's 8080.
server.port=${PORT:8080}

# Used to build the links in invitations. Change it when the site runs on a real domain.
divistay.base-url=${DIVISTAY_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
# How long rooms stay locked while the group pays (the spec says 30). Lower it to try the expiry quickly.
divistay.payment-window-minutes=30
# How often the background job checks expiries and hotel retries.
divistay.lifecycle-interval-ms=10000

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.error.whitelabel.enabled=false

# Languages: messages.properties (English, default) and messages_he.properties (Hebrew)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
